<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">

  <div class="max-w-7xl mx-auto flex flex-col gap-4">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">

      <div>

        <h1 class="text-3xl font-bold text-slate-900">
          {{ isEditMode ? 'Editar producto' : 'Crear nuevo producto' }}
        </h1>

        <p class="text-slate-600">
          {{ isEditMode
            ? 'Modifica la información del producto.'
            : 'Agrega un nuevo producto al inventario.' }}
        </p>

      </div>

      <div class="flex gap-4">

        <p-button
          label="Cancelar"
          [raised]="true"
          severity="secondary"
          [routerLink]="['/admin/lista-productos']"
        />

        <p-button
          label="Guardar Producto"
          icon="pi pi-save"
          [raised]="true"
          severity="primary"
          (onClick)="onSave()"
        />

      </div>

    </div>

    <!-- Formulario -->
    <div class="grid lg:grid-cols-3 sm:grid-cols-1 gap-4">

      <!-- Información -->
      <section
        class="lg:col-span-2
               bg-surface-100
               p-6
               rounded-xl
               border border-surface-300
               shadow-sm"
      >

        <h3 class="text-lg font-bold mb-6">

          <span
            class="pi pi-box text-blue-600 mr-1"
          ></span>

          Información General

        </h3>

        <div class="grid grid-cols-1 gap-5">

          <!-- Nombre -->
          <div>

            <label
              class="block text-sm font-medium
                     text-gray-600 mb-1"
            >
              Nombre del Producto
            </label>

            <input
              pInputText
              type="text"
              [(ngModel)]="form.name"
              placeholder="Ej: Taladro Percutor"
              class="w-full"
            />

          </div>

          <!-- Descripción -->
          <div>

            <label
              class="block text-sm font-medium
                     text-gray-600 mb-1"
            >
              Descripción
            </label>

            <textarea
              pTextarea
              [(ngModel)]="form.description"
              rows="5"
              placeholder="Descripción del producto"
              class="w-full"
            ></textarea>

          </div>

          <!-- Precio / Stock -->
          <div class="grid md:grid-cols-2 gap-4">

            <div>

              <label
                class="block text-sm font-medium
                       text-gray-600 mb-1"
              >
                Precio
              </label>

              <p-inputnumber
                [(ngModel)]="form.price"
                mode="currency"
                currency="ARS"
                locale="es-AR"
                class="w-full"
              />

            </div>

            <div>

              <label
                class="block text-sm font-medium
                       text-gray-600 mb-1"
              >
                Stock
              </label>

              <p-inputnumber
                [(ngModel)]="form.stock"
                [min]="0"
                class="w-full"
              />

            </div>

          </div>

        </div>

      </section>

      <!-- Organización -->
      <section
        class="bg-surface-100
               p-6
               rounded-xl
               border border-surface-300
               shadow-sm"
      >

        <h3 class="text-lg font-bold mb-6">

          <span
            class="pi pi-sitemap text-blue-600 mr-1"
          ></span>

          Organización

        </h3>

        <div class="grid grid-cols-1 gap-5">

          <!-- Marca -->
          <div>

            <label
              class="block text-sm font-medium
                     text-gray-600 mb-1"
            >
              Marca
            </label>

            <p-select
              [options]="brands"
              [(ngModel)]="form.brandId"
              optionLabel="name"
              optionValue="id"
              placeholder="Selecciona una marca"
              class="w-full"
              appendTo="body"
            />

          </div>

          <!-- Categoría -->
          <div>

            <label
              class="block text-sm font-medium
                     text-gray-600 mb-1"
            >
              Categoría
            </label>

            <p-select
              [options]="categories"
              [(ngModel)]="form.categoryId"
              optionLabel="name"
              optionValue="id"
              placeholder="Selecciona una categoría"
              class="w-full"
              appendTo="body"
            />

          </div>

        </div>

      </section>

    </div>

  </div>

</div>
