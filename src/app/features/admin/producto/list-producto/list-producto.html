<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
    <div class="max-w-7xl mx-auto flex flex-col gap-4">

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
            <div>
                <h1 class="text-3xl font-bold">productos</h1>
                <p class="text-gray-600">Administra la organización de tus productos</p>
            </div>
            <p-button label="Añadir producto" [raised]="true" severity="primary" icon="pi pi-plus"
                [routerLink]="['/admin/form-producto']" />
        </div>

        <app-filtro-productos></app-filtro-productos>


        <div class="card">
            <p-table [value]="productos()" [tableStyle]="{ 'min-width': '30rem' }">
                <ng-template #header>
                    <tr>
                        <th>productos</th>
                        <th></th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-producto>
                    <tr>
                        <td class="font-semibold">
                            {{ producto.nombre }}
                        </td>

                        <td>
                            <div class="flex flex-row">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" [raised]="true"
                                    severity="secondary" class="mr-4" />
                                <p-button icon="pi pi-trash" [rounded]="true" severity="danger" />
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #footer>
                    <tr>
                        <td colspan="6">En total son {{ productos() ? productos().length : 0 }} productos.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>


    </div>
</div>
