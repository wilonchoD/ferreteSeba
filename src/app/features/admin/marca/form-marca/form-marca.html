<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">

  <div class="max-w-7xl mx-auto flex flex-col gap-4">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">

      <div>

        <h1 class="text-3xl font-bold text-slate-900">
          {{ isEditMode ? 'Editar marca' : 'Crear nueva marca' }}
        </h1>

        <p class="text-slate-600">
          {{ isEditMode
            ? 'Modifica los datos de la marca.'
            : 'Agrega una nueva marca al inventario.' }}
        </p>

      </div>

      <div class="flex gap-4">

        <p-button
          label="Cancelar"
          [raised]="true"
          severity="secondary"
          [routerLink]="['/admin/lista-marcas']"
        />

        <p-button
          label="Guardar Marca"
          icon="pi pi-save"
          [raised]="true"
          severity="primary"
          (onClick)="onSave()"
        />

      </div>

    </div>

    <!-- Form -->
    <section
      class="bg-surface-100 p-6 rounded-xl
             border border-surface-300 shadow-sm"
    >

      <h3 class="text-lg font-bold mb-6">

        <span class="pi pi-tag text-blue-600 mr-1"></span>

        Información de la Marca

      </h3>

      <div class="grid grid-cols-1 gap-5 max-w-3xl">

        <!-- Nombre -->
        <div>

          <label class="block text-sm font-medium text-gray-600 mb-1">
            Nombre de la Marca
          </label>

          <input
            pInputText
            type="text"
            [(ngModel)]="form.name"
            placeholder="Ej: Bosch"
            class="w-full"
          />

        </div>

        <!-- Descripción -->
        <div>

          <label class="block text-sm font-medium text-gray-600 mb-1">
            Descripción
          </label>

          <textarea
            pTextarea
            [(ngModel)]="form.description"
            rows="5"
            placeholder="Descripción de la marca"
            class="w-full"
          ></textarea>

        </div>

      </div>

    </section>

  </div>

</div>
