<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
  <div class="max-w-7xl mx-auto flex flex-col gap-6">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">

      <div>
        <h1 class="text-3xl font-bold text-slate-900">
          Marcas
        </h1>

        <p class="text-slate-600 mt-1">
          Gestiona las marcas de productos del inventario.
        </p>
      </div>

      <p-button
        label="Nueva Marca"
        icon="pi pi-plus"
        [raised]="true"
        severity="primary"
        [routerLink]="['/admin/form-marca']"
      />

    </div>

    <!-- Buscador -->
    <div class="bg-surface-100 p-4 rounded-xl border border-surface-300 shadow-sm">

      <div class="relative max-w-md">

        <i
          class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
        ></i>

        <input
          pInputText
          type="text"
          [(ngModel)]="searchTerm"
          (input)="filterBrands()"
          placeholder="Buscar marca..."
          class="w-full pl-10"
        />

      </div>

    </div>

    <!-- Tabla -->
    <section
      class="bg-surface-100 rounded-xl border border-surface-300 shadow-sm overflow-hidden"
    >

      <p-table
        [value]="filteredBrands"
        [paginator]="true"
        [rows]="10"
        responsiveLayout="scroll"
        [showGridlines]="false"
      >

        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Marca</th>
            <th>Descripción</th>
            <th class="text-center">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-brand>

          <tr>

            <td>
              {{ brand.id }}
            </td>

            <td>
              <span class="font-semibold text-slate-900">
                {{ brand.name }}
              </span>
            </td>

            <td>
              <span class="text-slate-600">
                {{ brand.description || 'Sin descripción' }}
              </span>
            </td>

            <td>
              <div class="flex justify-center gap-2">

                <p-button
                  icon="pi pi-pencil"
                  severity="secondary"
                  [text]="true"
                  [routerLink]="['/admin/form-marca', brand.id]"
                  pTooltip="Editar"
                />

                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  [text]="true"
                  (onClick)="deleteBrand(brand.id)"
                  pTooltip="Eliminar"
                />

              </div>
            </td>

          </tr>

        </ng-template>

        <ng-template pTemplate="emptymessage">

          <tr>
            <td colspan="4" class="text-center py-8 text-slate-500">
              No se encontraron marcas.
            </td>
          </tr>

        </ng-template>

      </p-table>

    </section>

  </div>
</div>
