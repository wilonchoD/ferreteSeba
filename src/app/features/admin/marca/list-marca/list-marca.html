<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
    <div class="max-w-7xl mx-auto flex flex-col gap-4">

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
            <div>
                <h1 class="text-3xl font-bold">Marcas</h1>
                <p class="text-gray-600">Administra la organización de tus productos por marcas</p>
            </div>
            <p-button label="Añadir Marca" [raised]="true" severity="primary" icon="pi pi-plus"
                (onClick)="nuevaMarca()"/>
        </div>

        <app-filtro-marcas></app-filtro-marcas>


        <div class="card">
            <p-table [value]="marcas()" [tableStyle]="{ 'min-width': '30rem' }">
                <ng-template #header>
                    <tr>
                        <th>Marca</th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-marca>
                    <tr>
                        <td class="font-semibold">
                            {{ marca.nombre }}
                        </td>

                        <td>
                            <div class="flex flex-row">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" [raised]="true"
                                    severity="secondary" class="mr-4" (onClick)="editarMarca(marca)" />
                                <p-button icon="pi pi-trash" [rounded]="true" severity="danger"
                                    (onClick)="eliminarMarca(marca.id)" />
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #footer>
                    <tr>
                        <td colspan="2">En total son {{ marcas() ? marcas().length : 0 }} marcas.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>


    </div>
</div>
