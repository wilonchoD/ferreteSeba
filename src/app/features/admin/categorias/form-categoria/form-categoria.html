<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
  <div class="max-w-7xl mx-auto flex flex-col gap-4">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">
          {{ isEditMode ? 'Editar categoría' : 'Crear nueva categoría' }}
        </h1>

        <p class="text-slate-600">
          {{ isEditMode
            ? 'Modifica los datos de la categoría seleccionada.'
            : 'Agrega una nueva categoría de productos al inventario.' }}
        </p>
      </div>

      <div class="flex gap-4">
        <p-button
          label="Cancelar"
          [raised]="true"
          severity="secondary"
          [routerLink]="['/admin/list-categorias']"
        />

        <p-button
          label="Guardar Categoría"
          [raised]="true"
          severity="primary"
          icon="pi pi-save"
          (onClick)="onSave()"
        />
      </div>
    </div>

    <!-- Formulario -->
    <div class="grid lg:grid-cols-3 sm:grid-cols-1 gap-4">

      <!-- Información general -->
      <section
        class="lg:col-span-2 bg-surface-100 p-6 rounded-xl
               border border-surface-300 shadow-sm"
      >

        <h3 class="text-lg font-bold mb-4">
          <span class="pi pi-info-circle text-blue-600 mr-1"></span>
          Información General
        </h3>

        <div class="grid grid-cols-1 gap-4">

          <!-- Nombre -->
          <div>
            <label
              class="block text-sm font-medium text-gray-600 mb-1"
            >
              Nombre de la Categoría
            </label>

            <input
              pInputText
              type="text"
              [(ngModel)]="form.name"
              placeholder="Ej: Sillas, Mesas, Herramientas"
              class="w-full"
            />
          </div>

          <!-- Descripción -->
          <div>
            <label
              class="block text-sm font-medium text-gray-600 mb-1"
            >
              Descripción
            </label>

            <textarea
              pTextarea
              [(ngModel)]="form.description"
              rows="5"
              class="w-full"
              placeholder="Describe qué productos pertenecen a esta categoría"
            ></textarea>
          </div>

        </div>
      </section>

      <!-- Organización -->
      <section
        class="bg-surface-100 p-6 rounded-xl
               border border-surface-300 shadow-sm"
      >

        <h3 class="text-lg font-bold mb-4">
          <span class="pi pi-sitemap text-blue-600 mr-1"></span>
          Organización
        </h3>

        <div class="grid grid-cols-1 gap-4">

          <div>
            <label
              class="block text-sm font-medium text-gray-600 mb-1"
            >
              Categoría Padre
            </label>

            <p-select
              [options]="parentCategories"
              [(ngModel)]="form.parentCategoryId"
              optionLabel="name"
              optionValue="id"
              placeholder="Selecciona una categoría"
              class="w-full"
              appendTo="body"
            />

          </div>

        </div>
      </section>

    </div>
  </div>
</div>
